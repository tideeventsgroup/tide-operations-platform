<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Tide Operations</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1f1e1e;
        color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #a8a29e;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        This page hasn't been loaded before, so it isn't available offline. If you're reporting an incident, use a
        field report page you've already opened once — reports made offline are saved on this device and sync
        automatically when signal returns.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
